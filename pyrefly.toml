# `Tests` is quite noisy
[[sub-config]]
matches = "tests" 

[sub-config.errors]
assert-type = false
missing-attribute = false
bad-argument-type = false
no-matching-overload = false
not-iterable = false
not-callable = false
bad-assignment = false
bad-return = false
unknown = false