[sub-config.errors]
bad-specialization = false
invalid-type-var = false


# result of `-stubs` issue
[[sub-config]]
matches = "pandas-stubs/_typing.pyi" 

[sub-config.errors]
type-alias-error = false
internal-error = false

[[sub-config]]
matches = "pandas-stubs/io/stata.pyi" 

[sub-config.errors]
