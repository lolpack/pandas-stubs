# pyrefly.toml

project_includes = ["pandas-stubs", "tests"]

# TODO: re-enable return type inference once perf improvements land
untyped-def-behavior = "check-and-infer-return-any"

site_package_path = [
  ".venv/lib/python3.12/site-packages/"
]

# TODO: fix bug where missing `-stubs` doesn't find the files
search-path =  ["pandas-stubs"]

# Global errors that we should test
[errors]
# Todo support union of None https://github.com/facebook/pyrefly/issues/162
internal-error = false
# Recursive type alias
type-alias-error = true


# Pyright in strict mode also agrees that these are errors
[[sub-config]] # reportMissingTypeArgument
matches = "pandas-stubs/core/series.pyi"

[sub-config.errors]
not-a-type = true
invalid-overload = true
internal-error = false # Todo support union of None https://github.com/facebook/pyrefly/issues/162
bad-override = false # `-stubs` issue

[[sub-config]]
matches = "pandas-stubs/core/reshape/tile.pyi"

[sub-config.errors]
not-a-type = false
internal-error = true # Todo support union of None https://github.com/facebook/pyrefly/issues/162

[[sub-config]]
matches = "pandas-stubs/core/frame.pyi"

[sub-config.errors]
not-a-type = true
internal-error = false # Todo support union of None https://github.com/facebook/pyrefly/issues/162

[[sub-config]]
matches = "pandas-stubs/core/indexes/multi.pyi" 

[sub-config.errors]
bad-specialization = true # pyright reportMissingTypeArgument
bad-override = true # reportMissingParameterType

[[sub-config]]
matches = "pandas-stubs/core/indexing.pyi"

[sub-config.errors]
type-alias-error = true # reportMissingTypeArgument

[[sub-config]] # reportUnknownParameterType
matches = "pandas-stubs/core/arrays/datetimelike.pyi"

[sub-config.errors]
bad-override = false

[[sub-config]] # reportMissingTypeArgument reportMissingTypeArgument
matches = "pandas-stubs/core/computation/eval.pyi"

[sub-config.errors]
not-a-type = true

[[sub-config]] # reportUnknownParameterType
matches = "pandas-stubs/core/window/ewm.pyi"

[sub-config.errors]
bad-override = true

[[sub-config]] # reportMissingTypeArgument
matches = "pandas-stubs/core/indexes/range.pyi"

[sub-config.errors]
bad-override = true

[[sub-config]] # reportIncompatibleVariableOverride
matches = "pandas-stubs/core/resample.pyi"

[sub-config.errors]
