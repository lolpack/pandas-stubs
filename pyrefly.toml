# Pyrefly bug
[[sub-config]]
matches = "pandas-stubs/_libs/tslibs/timestamps.pyi" 

[sub-config.errors]
bad-override = false

[[sub-config]]
matches = "pandas-stubs/io/formats/style.pyi" 

[sub-config.errors]
not-a-type = false
internal-error = false # Todo support union of None https://github.com/facebook/pyrefly/issues/162

[[sub-config]]
